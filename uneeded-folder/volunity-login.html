<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="./volunity-login.css">
</head>
<body>
  <section class="volunity-login-holder">
    <div class="login-holder">
      <div class="login-hold">
        <div class="logo-holder">
          <div class="logo">
            <img src="./image/Group.png" alt="Volunity">
          </div>
          <div class="text-hold">
            <h3 class="volun">Volunity</h3>
            <p>together for greater impact</p>
          </div>
        </div>

        <div class="normal-text">
        <h1>welcome back</h1>
        <p>Log in to see your tasks, your projects, or  your <br> organization's dashboard.</p>
        </div>

        <div class="input-holder">
          <p class="email-text">Email address</p><br/>
          <input type="email" id="email address" name="email" placeholder="you@example.com" class="email-input"/><br /><br />
          <p class="email-text">Password</p><br/>
          <input type="password" id="password" name="password" placeholder="Enter your password" class="email-input"/><br /><br />
          <div class="remember-holder">
            <input type="checkbox" id="agree" class="remember"  /> <label for="checkbox" class="remember-text">Remember me</label>
           <a href="#">Forget Password</a> 
          </div>
        </div>

        <div class="log-in-holder">
          <button type="submit" class="button-login">Log in</button>
          <div class="line-holder">
            <hr class="line">
            <p class="or-text">or</p>
            <hr class="line">
          </div>
          <button type="button" class="login-button">Continue with Google</button>
        </div>

        <p class="sign-up">
          Don’t have an account? 
          <a href="#">Sign Up</a> 
        </p>

      </div>
    </div>

    <div class="img-holder">
      <!-- <img src="./image/Frame 10.png" alt="Volunteer"> -->
    </div>
  </section>
</body>
</html>
