<!-- NGO signup -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NGO signup</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/ngo-signup.css" />
  </head>
  <body>
    <header class="header-logo">
      <div class="header-logo">
        <img src="../assets/logo/logo.svg" alt="Volunteer logo" />
      </div>
    </header>

    <main>
      <section class="signup-container">
        <div class="signup-card">
          <!-- Left Side -->

          <div class="signup-content">
            <div class="signup-heading">
              <h1>Join as an Administrator</h1>

              <p>
                Set up your NGO account to start managing projects and
                volunteers with efficiency and care.
              </p>
            </div>

            <form id="signup-form" class="signup-form">
              <!-- NGO INFORMATION -->

              <div class="form-section">
                <h2>NGO Information</h2>

                <div class="form-group">
                  <label for="organization-name">Organization Name</label>
                  <div class="input-box">
                    <img src="../assets/icons/Icon-ngo.svg" alt="" />
                    <input
                      type="text"
                      id="org-full-name"
                      placeholder="e.g. Green Earth Initiative"
                      required
                    />
                  </div>
                </div>

                <div class="form-group">
                  <label for="ngo-registration-ID">NGO Registration ID</label>
                  <div class="input-box">
                    <img src="../assets/icons/ngo-id.svg" alt="" />
                    <input
                      id="reg-ID"
                      type="text"
                      placeholder="Official RegistrationNumber"
                      required
                    />
                  </div>
                </div>
              </div>

              <!-- PERSONAL DETAILS -->

              <div class="form-section">
                <h2>Personal Details</h2>

                <div class="form-group">
                  <label for="Full Name">Full Name</label>
                  <div class="input-box">
                    <img src="../assets/icons/iconamoon_profile.svg" alt="" />
                    <input
                      type="text"
                      id="fullname"
                      placeholder="Jane Doe"
                      required
                    />
                  </div>
                </div>

                <div class="form-group">
                  <label for="work-em">Work Email Address</label>
                  <div class="input-box">
                    <img src="../assets/icons/oui_email.svg" alt="" />
                    <input
                      type="email"
                      id="email"
                      placeholder="jane@organization.org"
                      required
                    />
                  </div>
                </div>
                <div class="form-group">
                  <label>Password</label>
                  <div class="input-box">
                    <input
                      class="password-input"
                      type="password"
                      id="password"
                      placeholder="Enter your password"
                      required
                    />
                    <img src="../assets/icons/Button.svg" alt="" />
                  </div>
                </div>

                <div class="form-group">
                  <label>Confirm Password</label>
                  <div class="input-box">
                    <input
                      type="password"
                      id="confirm-password"
                      placeholder="Confirm your password"
                      required
                    />
                    <img src="../assets/icons/Button.svg" alt="" />
                  </div>
                </div>
              </div>

              <a href="./login.html" class="signup-btn">
                Complete Registration
              </a>
            </form>
          </div>

          <!-- Right Side -->

          <!-- <div class="signup-image">
            <img
              src="../assets/images/login-welcome-back-img.jpg"
              alt="Volunteer smiling outdoors"
            />
          </div> -->
        </div>
      </section>
    </main>
    <script src="../js/signup.js"></script>
  </body>
</html>
