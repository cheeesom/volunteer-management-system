<!-- Sign up -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Volunteer-Signup</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/volunteersignup..css" />
  </head>
  <body>
    <header>
      <div class="header-logo">
        <img src="../assets/logo/logo.svg" alt="logo" />
      </div>
    </header>

    <main>
      <section class="signup-container">
        <div class="signup-heading">
          <h1>Registration Form</h1>
        </div>

        <form id="signup-form" data-role="VOLUNTEER">
          <div class="signup-form">
            <!-- personal details -->
            <div class="form-column">
              <h2 class="section-title">
                <img src="../assets/icons/iconamoon_profile.svg" alt="profile-icon" />
                Personal Details
              </h2>

              <div class="form-group">
                <label for="fullname">Full Name</label>
                  <input
                    type="text"
                    id="firstName"
                    placeholder="eg. John"
                    required
                  />

                  <input
                    type="text"
                    id="lastName"
                    placeholder="eg. Doe"
                    required
                  />
              </div>

              <div class="form-group">
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" required/>
              </div>

              <div class="form-group">
                <label for="gender">Gender</label>

                <select id="gender" name="gender" required>
                  <option value="">Select gender</option>
                  <option value="Male">Male</option>
                  <option value="Female">Female</option>
                  <option value="Prefer not to say">Prefer not to say</option>
                </select>
              </div>
            </div>

            <!-- Contact Information -->

            <div class="form-column">
              <h2 class="section-title">
                <img src="../assets/icons/hugeicons_contact-01.svg" alt="Contact-icon" />
                Contact Information
              </h2>

              <div class="form-group">
                <label for="email">
                  Email Address </label>
         <div class="input-box"> 
          <img src="../assets/icons/oui_email.svg" alt="">

                <input type="email" id="email" 
                placeholder="alexjohnson@gmail.com" required/>
              </div>
              </div>

              <div class="form-group">
                <label for="phone">Phone Number</label>
<div class="input-box"> 
          <img src="../assets/icons/solar_phone-linear.svg" alt="">
             
                <input type="tel" id="phone" placeholder="+234 7900655543" required/>
              </div>
 </div>
              <div class="form-group">
                <label for="address">Residential Address</label>
           <div class="input-box"> 
          <img src="../assets/icons/basil_location-outline (1).svg" alt="">
                <input
                  id="address"
                  placeholder="Enter your address"
                ></input>
                  </div>
              </div>
            </div>

            <!-- Interests & Skills -->

            <div class="form-column">
              <h2 class="section-title">
                <img
                  src="../assets/icons/material-symbols-light_interests-outline (1).svg"
                  alt="interests-icon"
                />
                Interests & Skills
              </h2>

              <div class="form-group">
                <label class="interests-label"> What are you interested in? </label>

                <div class="interest-tags">
                  <button type="button">Environment</button>
                  <button type="button">Education</button>
                  <button type="button">Youth</button>
                  <button type="button">Healthcare</button>
                  <button type="button">Teaching</button>
                  <button type="button">Welfare</button>
                </div>
              </div>

              <div class="form-group">
                <label for="skills"> Key Skills </label>

                <input
                  id="skills"
                  placeholder="Add relevant or preferred skills"
                ></input>
              </div>

              <!-- Suggested skills -->
              <div class="suggested-skills">
                <div class="skill-set">
                  <button type="button">Logistics</button>
                  <button type="button">Coding</button>
                  <button type="button">Translation</button>
                  <button type="button">Social media management</button>
                </div>
              </div>
            </div>

            <!-- Terms -->
            <div class="form-footer">

            <div class="terms">

              <label for="terms">
                 <input type="checkbox" id="terms" class="checkbox" required/>
                I agree to the Terms of Service and Privacy Policy regarding my
                volunteer data.
              </label>

            <!-- Button -->

            <button type="submit" class="register-btn">Register</button>
             </div>
             </div>
        </form>
      </section>
    </main>
    <script src="../js/signup.js"></script>
  </body>
</html>
