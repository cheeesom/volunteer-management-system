<!-- Project Coordinator signup -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Coordinator signup</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/projectcoordinator-signup.css" />
  </head>
  <body>
    <!-- Volunity Logo -->

    <header class="header-logo">
      <img src="../assets/logo/logo.svg" alt="logo" />
    </header>

    <main>
      <section class="signup-container">
        <div class="signup-card">
          <div class="signup-heading">
            <h1>Become a Team Lead</h1>

            <p>
              Join our core leadership team. Coordinate high-impact volunteer
              projects and empower community change agents.
            </p>
          </div>

          <form
            id="signup-form"
            data-role="COORDINATOR"
            class="coordinator-form"
          >
            <div class="signup-form">
              <!-- LEFT COLUMN -->

              <div class="form-column">
                <h2>
                  <img src="../assets/icons/Container (2).svg" alt="" /> Account
                  Basics
                </h2>

                <div class="form-group">
                  <label>Full Name</label>
                  <input
                    type="text"
                    id="firstName"
                    placeholder="eg. John"
                    required
                  />

                  <input
                    type="text"
                    id="lastName"
                    placeholder="eg. Doe"
                    required
                  />
                </div>

                <div class="form-group">
                  <label>Work Email</label>
                  <div class="input-box">
                    <img src="../assets/icons/oui_email.svg" alt="" />
                    <input
                      type="email"
                      id="email"
                      placeholder="john@unityserve.org"
                      required
                    />
                  </div>
                </div>

                <div class="form-group">
                  <div class="input-box">
                    <img src="../assets/icons/solar_phone-linear.svg" alt="" />
                    <input
                      type="tel"
                      id="phonenumber"
                      placeholder="+234 780845678"
                      required
                    />
                  </div>
                </div>

                <div class="form-group">
                  <label>Password</label>
                  <div class="input-box">
                    <img src="../assets/icons/Container (10).svg" alt="" />
                    <input
                      type="password"
                      id="password"
                      placeholder="*******"
                      required
                    />

                    <img src="../assets/icons/Button.svg" alt="" />
                  </div>
                </div>
              </div>

              <!-- RIGHT COLUMN -->

              <div class="form-column">
                <h2>Leadership Profile</h2>

                <div class="form-group">
                  <label
                    ><img src="../assets/icons/Container (4).svg" alt="" />
                    Years of Leadership Experience</label
                  >
                  <div class="input-box">
                    <img src="../assets/icons/Container.svg" alt="" />

                    <input
                      type="number"
                      id="years-of-exp"
                      placeholder="e.g. 10"
                      required
                    />
                  </div>
                </div>

                <div class="form-group">
                  <label>Years of Professional Experience</label>
                  <div class="input-box">
                    <img src="../assets/icons/Container (10).svg" alt="" />
                    <input
                      type="number"
                      id="year-of-proff-exp"
                      placeholder="e.g. 5"
                      required
                    />
                  </div>
                </div>

                <div class="form-group">
                  <label>Specialized Certifications</label>

                  <div class="interest-tags">
                    <button>First Aid</button>
                    <button>Project Management</button>
                    <button>Disaster Response</button>
                    <button>Conflict Mediation</button>
                  </div>
                </div>

                <div class="form-group">
                  <label>Leadership Skills</label>

                  <div class="skills-list">
                    <button type="button" id="skill-button">
                      Crisis Management
                    </button>
                    <button>Public Speaking</button>
                    <button>Fund Raising</button>
                    <button>Strategic Planning</button>
                  </div>
                </div>

                <div class="form-group">
                  <label class="upload-box">
                    Attach Certifications or Resume
                    <div class="upload-input">
                      <div class="input-boxx">
                        <img src="../assets/icons/Icon (4).svg" alt="" />
                      </div>
                      <div input-box>
                        <input type="file" hidden />
                        <p>
                          Click to upload or drag and drop <br />
                          PDF or JPEG (max 5.MB)
                        </p>
                      </div>
                    </div>
                  </label>
                </div>
              </div>
            </div>

            <footer class="form-footer">
              <div class="terms">
                <input type="checkbox" id="terms" required />

                <label for="terms">
                  I agree to the Coordinator Terms & Conditions.
                  <div class="terms-p">
                    <small>
                      I understand that as a Team Lead, I am responsible for the
                      safety and data privacy of my assigned volunteers as per
                      Volunity guidelines.
                    </small>
                  </div>
                </label>
              </div>
            </footer>
          </form>
          <div register-btn>
            <button type="submit" class="create-acct-btn">
              Create Coordinator Account
            </button>
          </div>
        </div>
      </section>
    </main>
    <script src="../js/signup.js"></script>
  </body>
</html>
