<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - NGO Management System</title>
    <link rel="stylesheet" href="/css/login.css" />
  </head>
  <body>
    <div class="login-container">
      <!-- LEFT SIDE - LOGIN FORM -->
      <div class="login-left">
        <div class="login-card">
          <!-- LOGO -->
          <div class="logo-section">
            <img src="/assets/logo/logo.svg" alt="Volunity Logo" class="logo" />
            <span class="logo-text">Volunity</span>
          </div>

          <!-- WELCOME TEXT -->
          <h1 class="welcome-heading">Welcome Back</h1>
          <p class="welcome-subtitle">
            Log in to see your tasks, your projects, or your organization's
            dashboard.
          </p>

          <!-- LOGIN FORM -->
          <form id="loginForm" class="login-form">
            <!-- EMAIL INPUT -->
            <div class="form-group">
              <label for="email">Email address</label>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="you@example.com"
                required
              />
              <span class="error-message" id="emailError"></span>
            </div>

            <!-- PASSWORD INPUT -->
            <div class="form-group">
              <label for="password">Password</label>
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
              />
              <span class="error-message" id="passwordError"></span>
            </div>

            <!-- REMEMBER ME & FORGOT PASSWORD -->
            <div class="form-options">
              <div class="checkbox-group">
                <input type="checkbox" id="rememberMe" name="rememberMe" />
                <label for="rememberMe">Remember me</label>
              </div>
              <a href="#" class="forgot-password">Forgot password?</a>
            </div>

            <!-- LOG IN BUTTON -->
            <button type="submit" class="login-button">Log in</button>
          </form>

          <!-- DIVIDER -->
          <div class="divider">
            <span>or</span>
          </div>

          <!-- GOOGLE LOGIN -->
          <button class="google-login">
            <img src="/assets/icons/google.jpg" alt="Google" />
            Continue with Google
          </button>

          <!-- SIGN UP LINK -->
          <p class="signup-link">
            Don't have an account?
            <a href="#">Sign up</a>
          </p>
        </div>
      </div>

      <!-- RIGHT SIDE - IMAGE -->
      <div class="login-right">
        <div class="image-placeholder">
          <div class="placeholder-content">
            <img
              src="/assets/images/login-welcome-back-img.jpg"
              alt="Volunteer"
            />
          </div>
        </div>
      </div>
    </div>

    <!-- SUCCESS MESSAGE -->
    <div id="successModal" class="success-modal" style="display: none">
      <div class="success-content">
        <div class="success-icon">✅</div>
        <h3>Welcome!</h3>
        <p id="successMessage"></p>
        <button class="success-button" onclick="closeSuccess()">
          Continue
        </button>
      </div>
    </div>

    <script src="/js/login.js"></script>
  </body>
</html>
